name: NewsAlpha pipeline

on:
  schedule:
    - cron: "*/15 * * * *"     # ingest news + paper-trading step every 15 minutes
    - cron: "15 22 * * 1-5"    # rebuild the backtest after the US close on weekdays
    - cron: "0 6 * * 0"        # weekly verification (data cross-checks, calibration, browser)
  workflow_dispatch:
    inputs:
      mode:
        description: "ingest | backtest | all | verify"
        default: "ingest"
  push:
    branches: [master]
    paths: ["pipeline/**", "tests/**", "data/catalog/**"]

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    if: github.event.schedule != '0 6 * * 0' && inputs.mode != 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAS_CLAUDE: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional Claude layer
        if: env.HAS_CLAUDE == 'true'
        run: pip install anthropic

      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.mode }}";
          elif [ "${{ github.event_name }}" = "push" ]; then m="all";
          elif [ "${{ github.event.schedule }}" = "15 22 * * 1-5" ]; then m="all";
          else m="ingest"; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.run ${{ steps.mode.outputs.mode }}

      - name: Paper-trading step (₹2L LRS account, mechanical rules)
        if: always()
        run: python -m pipeline.paper

      - name: Commit data
        run: |
          git config user.name "newsalpha-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push

  verify:
    if: github.event.schedule == '0 6 * * 0' || inputs.mode == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Unit tests incl. network checks
        env:
          NETWORK: "1"
        run: python -m unittest discover -s tests
      - name: Data & method verification
        run: python -m pipeline.verify
      - name: Browser checks (JS/Python parity, XSS, JS errors)
        run: python tests/browser_check.py
      - name: Commit report
        run: |
          git config user.name "newsalpha-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: weekly verification $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash && git push
